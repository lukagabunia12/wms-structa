name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  controle-et-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-non-sensible
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Style et erreurs de code (ruff)
        # Le style est décidé une fois dans pyproject.toml et vérifié ici : une
        # revue de code parle du fond, pas des espaces. `ruff` attrape aussi les
        # vraies fautes — import mort, nom indéfini, variable jamais lue.
        run: |
          pip install ruff
          ruff check .

      - name: Contrôles Django
        run: python manage.py check
      - name: Vérifier qu'aucune migration ne manque
        # `0001_initial.py` est committé : la CI doit échouer si models.py a changé sans
        # migration, au lieu d'en générer une à la volée et de masquer l'oubli.
        run: python manage.py makemigrations --check --dry-run
      - name: Appliquer les migrations
        run: python manage.py migrate
      - name: Controle de deploiement
        # Echoue sur une ERREUR de configuration (clé secrète d'exemple, réglage
        # incohérent) ; les avertissements HTTPS n'ont pas de sens sur un runner CI.
        run: python manage.py check --deploy --fail-level ERROR

      - name: Controle de deploiement, profil durci
        # Le profil réellement servi aux postes : derrière le proxy TLS, Django
        # doit passer le contrôle SANS le moindre avertissement. C'est ici qu'on
        # s'en assure, pas le jour de la mise en service.
        env:
          DJANGO_DERRIERE_PROXY: "1"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Verifier la syntaxe de l'interface
        # 130 Ko de JavaScript servis sans outil de build : une faute de frappe ne
        # se voit qu'à l'ouverture de l'application, chez l'opérateur.
        run: node --check wms/static/app/app.js

      - name: Verifier les ecrans de l'interface
        # `node --check` ne voit que la syntaxe : un écran dont la fonction a
        # disparu passe sans broncher et ne casse qu'au clic sur le menu.
        run: node outils/verifier_interface.js

      - name: Lancer les tests
        run: python manage.py test -v 2
